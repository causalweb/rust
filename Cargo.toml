[package]
name = "causalweb"
version = "0.1.0-experimental"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Experimental Rust implementation of Causal Web evidence and constrained observations"
repository = "https://github.com/causalweb/rust"
license = "Apache-2.0 OR MIT"
exclude = ["tests/consumer/", "node_modules/", "package.json", "package-lock.json", "biome.json", ".changeset/"]

[features]
axum-0_8 = ["dep:axum"]

[dependencies]
axum = { version = "0.8.9", default-features = false, optional = true }
base64 = "0.22.1"
http = "1.3"
p256 = { version = "0.14.0", features = ["ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "arbitrary_precision"] }
sfv = "0.16.0"
uriparse = "0.6.4"

[dev-dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
