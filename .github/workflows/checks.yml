name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: causalweb/spec
          ref: a012c85a5af5b7d5506a1c9a83f94815a124b1ea
          path: .spec
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: causalweb/conformance
          ref: 4c1af5fdc93890656ce9387ea2dabb6083deb460
          path: .conformance
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.95.0
      - run: rustc --version
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix .conformance --ignore-scripts
      - run: npm run check
      - run: cargo fmt --check
      - run: rustfmt --edition 2024 --check tests/consumer/src/main.rs
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: node scripts/check-wire.mjs .spec
      - run: node .conformance/runner.mjs --spec .spec -- cargo run --locked --quiet --example conformance_adapter
      - run: node .conformance/runner.mjs --spec .spec --profile prefix-evaluation-v1 -- cargo run --locked --quiet --example conformance_adapter
      - run: node .conformance/runner.mjs --spec .spec --profile http-client-confirmation-v1 -- cargo run --locked --quiet --example conformance_adapter
      - run: node scripts/check-package.mjs
      - run: npm run changeset:status
      - run: npm run release:check
      - if: github.event_name == 'pull_request'
        run: npm run release:check
        env:
          CAUSALWEB_CHANGESET_BASE: ${{ github.event.pull_request.base.sha }}
      - run: npm run test:release
      - run: npm audit --audit-level=high
